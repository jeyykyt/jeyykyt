<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Engr. Kouzie ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            margin:0;
            overflow:hidden;
            background: radial-gradient(circle at center, #fff0f6, #ffd6eb);
            font-family: 'Segoe UI', cursive;
        }

        #scene { position:relative; width:100vw; height:100vh; }

        .star {
            position:absolute;
            font-size:clamp(14px, 2vw, 22px);
            cursor:pointer;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%,100%{opacity:0.3}
            50%{opacity:1}
        }

        .fade { animation: fadeIn 1s ease forwards; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }

        .float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)} }

        .card { transition: all .4s }
        .card:hover { transform: scale(1.1) }

        .glass {
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.5);
        }

        #modal {
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.6);
            display:none;
            align-items:center;
            justify-content:center;
        }

    </style>
</head>

<body>

<script>
    // Prompt for magic word
    let magicAccepted = false;
    while(!magicAccepted){
        let input = prompt("What's the magic word?");
        if(input && input.replace(/\s+/g,'').toLowerCase() === 'kyutsijejy'){
            magicAccepted = true;
            alert('Magic confirmed! Welcome 👑');
        } else {
            alert('Hmm… nonoo!');
        }
    }
</script>

<div id="scene">

    <h1 class="absolute top-10 w-full text-center text-3xl sm:text-5xl text-pink-500 font-bold float">
        👑 Princess Engr. Kouzie 👑
    </h1>

    <!-- Main Image -->
    <img src="/images/k5.jpg" class="absolute left-1/2 top-1/2 w-28 h-28 sm:w-44 sm:h-44 rounded-full -translate-x-1/2 -translate-y-1/2 shadow-2xl border-4 border-white">

    <!-- Instructions -->
    <p class="absolute bottom-6 w-full text-center text-sm sm:text-lg text-pink-600 px-4">
        ✨ Tap the stars… they hide secrets ✨
    </p>

</div>

<!-- Modal -->
<div id="modal" onclick="closeModal()">
    <div class="glass p-4 sm:p-6 rounded-2xl text-center text-pink-700 max-w-xs sm:max-w-sm mx-4">
        <img id="modalImg" class="rounded-xl mb-4" />
        <p id="modalText"></p>
    </div>
</div>

<script>
    const secrets = [
        { text: "💖 You walk in and suddenly everything runs smoother… like the system finally stopped lagging.                       segi kay bday.", img: "/images/k1.jpg" },
        { text: "🌸 Lowkey magic… like debugging a bad day without even opening Harvey!", img: "/images/k2.jpg" },
        { text: "✨ In case you forgot today— you’re doing better than you think :DD", img: "/images/k3.jpg" },
        { text: "👑 Disney Princess? oooor Princess Warrior?", img: "/images/k5.jpg" },
        { text: "💖 This young lady says, \"Thank you for being strong!\"", img: "/images/k4.jpg" },
        { text: "🎉 Another build completed successfully… and chaaarr sana all prepared.", img: "/images/k6.jpg" },
        { text: "you got a free pass. —but naah, still me is kyut", img: "/images/kj.jpg" },
    ];

    function createStars() {
        for(let i=0;i<25;i++){
            const star=document.createElement('div');
            star.className='star';
            star.innerText='✨';
            star.style.left=Math.random()*100+'vw';
            star.style.top=Math.random()*100+'vh';
            star.onclick=()=>reveal();
            document.getElementById('scene').appendChild(star);
        }
    }

    function reveal(){
        const s = secrets[Math.floor(Math.random()*secrets.length)];
        document.getElementById('modalImg').src = s.img;
        document.getElementById('modalText').innerText = s.text;
        document.getElementById('modal').style.display='flex';
    }

    function closeModal(){
        document.getElementById('modal').style.display='none';
    }

    // floating hearts
    setInterval(()=>{
        const h=document.createElement('div');
        h.innerText='💖';
        h.style.position='absolute';
        h.style.left=Math.random()*100+'vw';
        h.style.bottom='-20px';
        h.style.fontSize='20px';
        h.style.animation='floatUp 4s linear';
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),4000);
    },500);

    const style=document.createElement('style');
    style.innerHTML=`
@keyframes floatUp {
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-100vh);opacity:0}
}`;
    document.head.appendChild(style);

    // start
    createStars();
</script>

</body>
</html>
